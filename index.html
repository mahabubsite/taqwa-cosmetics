<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Subtle floating animation for the profile picture */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* Hide scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<!-- Deep modern gradient background -->
<body class="bg-gradient-to-br from-[#FFF8F5] via-white to-[#FDE7EE] min-h-screen text-[#593C23] antialiased flex items-center justify-center p-6">
    
    <!-- Main Container: Constrained width for mobile-first bio link style -->
    <div class="max-w-md w-full mx-auto flex flex-col items-center pb-12 pt-8 relative z-10">
        
        <!-- Profile Picture Section -->
        <div class="relative mb-6">
            <!-- Decorative blur ring behind image -->
            <div class="absolute inset-0 bg-[#E51865] rounded-full blur-2xl opacity-10 animate-pulse"></div>
            <!-- Profile Image Container -->
            <div class="relative z-10 w-28 h-28 rounded-full overflow-hidden flex items-center justify-center bg-white shadow-md mx-auto border border-pink-50">
                <!-- Replace 'logo.png' below with your actual image URL if hosting externally -->
                <img 
                    src="https://i.postimg.cc/NfbcwdbV/Logo.jpg" 
                    alt="Taqwa Cosmetics" 
                    class="object-contain w-full h-full p-2 animate-float"
                >
            </div>
        </div>

        <!-- Name and Bio Section -->
        <h1 class="text-3xl font-extrabold tracking-tight mb-2 text-[#593C23] text-center">
            Taqwa Cosmetics
        </h1>
        <p class="text-[#593C23]/70 font-medium mb-10 text-center px-4 text-sm">
            Premium Cosmetics & Beauty ✨
        </p>

        <!-- Links Container -->
        <div class="w-full flex flex-col gap-4">
            
            <!-- Facebook Button -->
            <a href="https://www.facebook.com/profile.php?id=100083169040447" target="_blank" rel="noopener noreferrer" 
               class="group relative w-full flex items-center justify-center p-4 rounded-2xl bg-white shadow-sm border-2 border-[#E51865] text-[#593C23] hover:bg-[#E51865] hover:text-white hover:shadow-md transition-all duration-300 hover:-translate-y-1">
                
                <!-- Facebook Icon (SVG) -->
                <div class="absolute left-5 flex items-center justify-center w-10 h-10 rounded-full bg-[#593C23]/5 group-hover:bg-white/20 transition-colors">
                    <svg class="w-5 h-5 text-[#593C23] group-hover:text-white transition-colors" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </div>
                
                <!-- Button Text -->
                <span class="font-semibold tracking-wide text-[#593C23] group-hover:text-white transition-colors">Follow on Facebook</span>
            </a>

            <!-- TikTok Button -->
            <a href="https://www.tiktok.com/@taqwa_cosmetics" target="_blank" rel="noopener noreferrer" 
               class="group relative w-full flex items-center justify-center p-4 rounded-2xl bg-white shadow-sm border-2 border-[#E51865] text-[#593C23] hover:bg-[#E51865] hover:text-white hover:shadow-md transition-all duration-300 hover:-translate-y-1">
                
                <!-- TikTok Icon (SVG) -->
                <div class="absolute left-5 flex items-center justify-center w-10 h-10 rounded-full bg-[#593C23]/5 group-hover:bg-white/20 transition-colors">
                    <svg class="w-5 h-5 text-[#593C23] group-hover:text-white transition-colors" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a5.64 5.64 0 0 1-1.04-.1z"/>
                    </svg>
                </div>
                
                <!-- Button Text -->
                <span class="font-semibold tracking-wide text-[#593C23] group-hover:text-white transition-colors">Follow on TikTok</span>
            </a>

        </div>

        <!-- Optional Footer branding -->
        <div class="mt-12 text-center text-xs text-[#593C23]/40 font-medium tracking-wider">
            TAQWA COSMETICS
        </div>
    </div>

</body>
</html>
